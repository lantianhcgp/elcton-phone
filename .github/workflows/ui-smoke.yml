name: android-ui-smoke
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful android-probe build run
        required: true
        type: string
      api_level:
        description: Android API level for this API30+ instrumentation suite (phone is API33)
        required: true
        type: choice
        options: ['33', '30', '34']
        default: '33'
      navigation_mode:
        description: System navigation used in the screenshot checks
        required: true
        type: choice
        options: [three-button, gestural]
        default: three-button
permissions:
  contents: read
  actions: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact signed APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          path: incoming
      - name: Display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libpulse0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libgl1 libopengl0 libglu1-mesa libxcb-cursor0
          python3 -m pip install Pillow==11.2.1
          python3 -B qa/test_capture_readiness.py
          python3 -B qa/test_final_report_gate.py
      - name: Enable KVM
        run: |
          printf 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"\n' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start and verify X display
        run: |
          Xvfb :99 -screen 0 1280x1600x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          python3 qa/wait_x.py
      - name: Exercise real APK without a paired device
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ':99'
          QA_NAVIGATION_MODE: ${{ inputs.navigation_mode }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: python3 qa/emulator_install_and_tour.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-${{ github.sha }}
          path: qa-evidence/
          if-no-files-found: warn
